<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="awka-api-base" content="/api">
    <title>Dispatcher | Awka Rides</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
        :root{--green:#16a34a;--dark:#111827;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--white:#fff;--danger:#b91c1c;--amber:#b45309}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font:14px Arial,sans-serif}.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:700;letter-spacing:.04em}.brand strong{color:var(--green)}.topbar small{color:var(--muted)}
        main{width:min(1500px,94%);margin:24px auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.toolbar h1{margin:0;font-size:28px}.toolbar-actions{display:flex;gap:8px;align-items:center}.button,select,input{font:inherit}.button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.button:disabled{cursor:wait;opacity:.55}.primary{background:var(--green);color:#fff}.secondary{background:#e2f3e7;color:#166534}.light{border:1px solid var(--line);background:#fff;color:var(--dark)}.danger{background:#fee2e2;color:var(--danger)}select,input{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.feedback{min-height:22px;margin:0 0 14px;color:var(--danger)}.feedback.success{color:#166534}
        .layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.05)}.queue{overflow:hidden}.queue-header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.queue-header h2,.details h2,.section-title{margin:0;font-size:17px}.ride-list{max-height:calc(100vh - 190px);overflow:auto}.ride-item{width:100%;padding:15px 16px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;cursor:pointer}.ride-item:hover,.ride-item.selected{background:#f0fdf4}.ride-item strong,.ride-item span{display:block}.ride-item strong{margin-bottom:5px}.ride-item span{color:var(--muted);font-size:12px}.ride-meta{display:flex!important;justify-content:space-between;gap:8px;margin-top:9px}.status{display:inline-block!important;width:max-content;padding:4px 7px;border-radius:999px;background:#e2e8f0;color:#334155;font-size:11px!important;font-weight:700}.status.REQUESTED{background:#fef3c7;color:#92400e}.status.DRIVER-ASSIGNED,.status.PAID{background:#dbeafe;color:#1d4ed8}.status.PICKED-UP{background:#ede9fe;color:#6d28d9}.status.COMPLETED{background:#dcfce7;color:#166534}.status.CANCELLED{background:#fee2e2;color:#991b1b}.details{padding:20px}.details-top{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:18px}.details-top p{margin:6px 0 0;color:var(--muted)}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}.detail{padding:11px;border:1px solid var(--line);border-radius:9px;background:#fcfdff}.detail label{display:block;margin-bottom:5px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}.detail span{word-break:break-word}.wide{grid-column:span 3}.section{padding-top:18px;margin-top:18px;border-top:1px solid var(--line)}.section-title{margin-bottom:12px}.action-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.map{height:280px;border-radius:10px;border:1px solid var(--line);overflow:hidden}.driver-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.driver-option{display:block;padding:12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.driver-option:hover,.driver-option.selected{border-color:var(--green);background:#f0fdf4}.driver-option input{margin-right:7px}.driver-option strong,.driver-option small{display:block;margin-top:5px}.driver-option small{color:var(--muted)}.inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.inline-form input{width:150px}.muted{color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.ride-list{max-height:330px}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}}@media(max-width:560px){main{width:94%}.toolbar,.details-top{align-items:stretch;flex-direction:column}.toolbar-actions{flex-wrap:wrap}.detail-grid{grid-template-columns:1fr}.wide{grid-column:span 1}.topbar{padding:15px 3%}}
    </style>
</head>
<body>
    <header class="topbar"><div class="brand">AWKA <strong>RIDES</strong> · DISPATCH</div><div><small>V1 Dispatcher</small> <button class="button light" id="logout-button" type="button" hidden>Log out</button></div></header>
    <section class="panel" id="login-panel" style="width:min(420px,94%);margin:80px auto;padding:24px">
        <h1 style="margin-top:0">Dispatcher login</h1>
        <p class="muted">Sign in to access ride operations.</p>
        <form id="login-form">
            <label style="display:block;margin:14px 0 6px" for="login-username">Username</label>
            <input id="login-username" name="username" autocomplete="username" required style="width:100%">
            <label style="display:block;margin:14px 0 6px" for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required style="width:100%">
            <p class="feedback" id="login-feedback" role="alert" aria-live="polite"></p>
            <button class="button primary" id="login-button" type="submit">Log in</button>
        </form>
    </section>
    <div id="dispatcher-app" hidden>
    <main>
        <div class="toolbar">
            <h1>Ride Queue</h1>
            <div class="toolbar-actions">
                <select id="status-filter" aria-label="Filter rides by status"><option value="">All statuses</option><option>REQUESTED</option><option>DRIVER ASSIGNED</option><option>PAID</option><option>PICKED UP</option><option>COMPLETED</option><option>CANCELLED</option></select>
                <button class="button secondary" id="refresh-button" type="button">Refresh</button>
            </div>
        </div>
        <p class="feedback" id="feedback" role="alert" aria-live="polite"></p>
        <div class="layout">
            <section class="panel queue" aria-labelledby="queue-title"><div class="queue-header"><h2 id="queue-title">Incoming rides</h2><span class="muted" id="ride-count">0</span></div><div class="ride-list" id="ride-list"><div class="empty">Loading rides...</div></div></section>
            <section class="panel details" id="details-panel" aria-labelledby="details-title"><div class="empty" id="empty-details">Select a ride to view its details.</div>
                <div id="ride-details" hidden>
                    <div class="details-top"><div><h2 id="details-title"></h2><p id="details-subtitle"></p></div><span class="status" id="detail-status"></span></div>
                    <div class="detail-grid" id="detail-grid"></div>
                    <section class="section"><h3 class="section-title">Location</h3><p class="muted" id="address-summary"></p><div class="map" id="ride-map"></div></section>
                    <section class="section"><h3 class="section-title">Assign driver</h3><div class="driver-list" id="driver-list"></div><div class="action-row" style="margin-top:12px"><button class="button primary" id="assign-button" type="button">Assign selected driver</button></div></section>
                    <section class="section"><h3 class="section-title">Fare confirmation</h3><div class="inline-form"><input id="fare-input" type="number" min="0.01" step="0.01" placeholder="Fare (NGN)" aria-label="Fare in naira"><button class="button primary" id="fare-button" type="button">Confirm fare</button><span class="muted" id="fare-state"></span></div></section>
                    <section class="section"><h3 class="section-title">Payment</h3><div class="inline-form"><select id="payment-status" aria-label="Payment status"><option>PAID</option><option>FAILED</option></select><input id="payment-reference" placeholder="Payment reference" aria-label="Payment reference"><select id="payment-method" aria-label="Payment method"><option>OPAY</option><option>CASH</option></select><button class="button primary" id="payment-button" type="button">Record payment</button></div><p class="muted" id="payment-state"></p></section>
                    <section class="section"><h3 class="section-title">Ride lifecycle</h3><div class="action-row" id="lifecycle-actions"></div></section>
                </div>
            </section>
        </div>
    </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="dispatcher.js"></script>
</body>
</html>
