name: Backend Check

on:
  push:
    branches: ["main", "fix/backend-lifecycle"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/main_supabase.py
      - name: Run Paystack validation tests
        run: |
          python -m pip install pytest
          python -m pytest backend/test_paystack.py -q
