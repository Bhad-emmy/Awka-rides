<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ọka-Rides · Payment Records</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0}.top{background:#0f172a;color:#fff;padding:18px max(4%,calc((100% - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:.04em}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#64748b}.btn{display:inline-block;border:0;border-radius:8px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer;background:#e2e8f0;color:#172033}.panel{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin-top:18px;overflow:auto}.summary{display:flex;gap:12px;flex-wrap:wrap}.metric{padding:14px;border:1px solid #e2e8f0;border-radius:9px;min-width:150px}.metric strong{display:block;font-size:22px;margin-top:4px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0;font-size:13px}th{background:#f8fafc;color:#475569}code{overflow-wrap:anywhere}.status{font-weight:800}.status.PAID{color:#15803d}.status.PENDING{color:#b45309}.status.FAILED{color:#b91c1c}.message{padding:14px;color:#475569}
</style>
</head>
<body>
<header class="top"><div class="brand">ỌKA-RIDES · PAYMENTS</div><a class="btn" href="/dispatcher.html">Back to dispatcher</a></header>
<main class="wrap">
<div class="head"><div><h1>Payment records</h1><p class="muted">Verified Paystack payments and dispatcher-recorded offline payments.</p></div><button class="btn" id="refresh">Refresh records</button></div>
<div class="summary"><div class="metric">Paid transactions<strong id="paid-count">—</strong></div><div class="metric">Paid total<strong id="paid-total">—</strong></div><div class="metric">All records<strong id="record-count">—</strong></div></div>
<section class="panel"><div id="message" class="message">Loading payment records…</div><table id="table" hidden><thead><tr><th>Date created</th><th>Ride</th><th>Method</th><th>Amount</th><th>Status</th><th>Payment reference</th><th>Paid at</th></tr></thead><tbody id="rows"></tbody></table></section>
</main>
<script>
const money=kobo=>'₦'+(Number(kobo||0)/100).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):esc(d.toLocaleString())};
async function load(){const msg=document.querySelector('#message'),table=document.querySelector('#table');msg.hidden=false;msg.textContent='Loading payment records…';table.hidden=true;try{const res=await fetch('/api/payment-records',{credentials:'include'});if(res.status===401){location.href='/dispatcher.html';return}const body=await res.json();if(!res.ok)throw new Error(body.detail||'Could not load payment records');const payments=body.payments||[];document.querySelector('#record-count').textContent=payments.length;const paid=payments.filter(p=>p.status==='PAID');document.querySelector('#paid-count').textContent=paid.length;document.querySelector('#paid-total').textContent=money(paid.reduce((sum,p)=>sum+Number(p.amount_kobo||0),0));document.querySelector('#rows').innerHTML=payments.map(p=>'<tr><td>'+date(p.created_at)+'</td><td><a href="/dispatcher.html">'+esc(p.ride_reference)+'</a></td><td>'+esc(p.method)+'</td><td>'+money(p.amount_kobo)+'</td><td><span class="status '+esc(p.status)+'">'+esc(p.status)+'</span></td><td><code>'+esc(p.reference)+'</code></td><td>'+date(p.paid_at)+'</td></tr>').join('');msg.textContent=payments.length?'Showing '+payments.length+' payment records.':'No payment records have been recorded yet.';table.hidden=!payments.length}catch(e){msg.textContent=e.message||'Unable to load payment records.'}}
document.querySelector('#refresh').addEventListener('click',load);load();
</script>
</body></html>
